name: Build Custom Kernel Spes

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel Spes SM6225
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev liblz4-tool lzop gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Clone Toolchain Clang (Proton Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Clone Kernel Source Spes & AnyKernel3
      run: |
        git clone --depth=1 https://github.com/xiaomi-spes-devs/android_kernel_xiaomi_spes kernel
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

    - name: Apply Config & Build Kernel
      run: |
        cd kernel
        export PATH="$(pwd)/../clang/bin:$PATH"

        MAKE_ARGS="ARCH=arm64 \
          SUBARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip"

        # Terapkan config optimasi jika tersedia
        if [ -f "../optimized_spes_kernel.config" ]; then
            cp ../optimized_spes_kernel.config arch/arm64/configs/spes_defconfig
        elif [ -f "arch/arm64/configs/vendor/spes_defconfig" ]; then
            cp arch/arm64/configs/vendor/spes_defconfig arch/arm64/configs/spes_defconfig
        fi

        make $MAKE_ARGS spes_defconfig
        make -j$(nproc --all) $MAKE_ARGS Image.gz

        # Copy hasil build ke AnyKernel3
        cp arch/arm64/boot/Image.gz ../anykernel/
        cd ../anykernel
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh || true
        zip -r9 ../SuperSpes-Kernel-Optimized.zip * -x .git README.md

    - name: Upload Kernel Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SuperSpes-Kernel-Flashable-ZIP
        path: SuperSpes-Kernel-Optimized.zip
